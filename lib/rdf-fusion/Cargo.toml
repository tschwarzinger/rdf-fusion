[package]
name = "rdf-fusion"
version.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["RDF", "SPARQL", "graph-database", "database"]
categories = ["database-implementations"]
repository = "https://codeberg.org/tschwarzinger/rdf-fusion"
documentation = "https://docs.rs/rdf-fusion"
description = """
a SPARQL database and RDF toolkit
"""
edition.workspace = true
rust-version.workspace = true

[dependencies]
datafusion.workspace = true
rdf-fusion-extensions.workspace = true
rdf-fusion-compute.workspace = true
rdf-fusion-physical.workspace = true
rdf-fusion-encoding.workspace = true
rdf-fusion-functions.workspace = true
rdf-fusion-common.workspace = true
futures.workspace = true
object_store.workspace = true
rdf-fusion-execution.workspace = true
rdf-fusion-logical.workspace = true
rdf-fusion-storage.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
deltalake.workspace = true

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio"] }
rand.workspace = true
tempfile.workspace = true
tokio-test.workspace = true
insta.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "store"
harness = false
