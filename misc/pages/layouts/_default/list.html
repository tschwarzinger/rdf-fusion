{{ define "main" }}
<div class="container py-5">
  <h1 class="mb-4">{{ .Title }}</h1>
  <div class="list-group">
    {{ range .Pages }}
    <a href="{{ .Permalink }}" class="list-group-item list-group-item-action">
      <h5 class="mb-1">{{ .Title }}</h5>
      {{ if .Date }}<small class="text-muted"
        >{{ .Date.Format "January 2, 2006" }}</small
      >{{ end }}
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
