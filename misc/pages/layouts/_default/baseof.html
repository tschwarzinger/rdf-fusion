<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="RDF Fusion" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href='{{ "favicon.png" | relURL }}' />
    <meta name="generator" content="Hugo {{ hugo.Version }}" />
    <title>{{ block "title" . }}{{ .Title }} | RDF Fusion{{ end }}</title>
    <link rel="stylesheet" href='{{ "generated/bundle.css" | relURL }}' />
    {{ $style := resources.Get "css/style.css" | minify }}
    <link rel="stylesheet" href="{{ $style.RelPermalink }}" />
  </head>
  <body class="d-flex flex-column min-vh-100 bg-light">
    {{ partial "nav.html" . }}
    <main class="flex-grow-1">{{ block "main" . }}{{ end }}</main>
    {{ partial "footer.html" . }}
    <script src='{{ "generated/bundle.js" | relURL }}'></script>
  </body>
</html>
