name: Release

on:
  push:
    tags:
      - 'release/*'

jobs:
  validate:
    name: Validate Version
    runs-on: tuw-runner
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Environment
        uses: ./.forgejo/actions/setup-rust
        with:
          components: ''
          tools: ''

      - name: Check Version
        run: bash misc/ci/check-version.sh ${{ github.ref_name }}

  publish-crates:
    name: Publish to Crates.io
    needs: validate
    runs-on: tuw-runner
    steps:
      - name: Install git-lfs
        run: |
          apt-get update
          apt-get install -y git-lfs
          git lfs install --skip-repo

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: true

      - name: Setup Rust Environment
        uses: ./.forgejo/actions/setup-rust
        with:
          tools: 'just taplo-cli'

      - name: Run Tests
        run: just lint bench::prepare-benches-tests test test-examples rustdoc

      - name: Publish
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build-binaries:
    name: Build Binaries
    needs: validate
    runs-on: tuw-runner
    strategy:
      matrix:
        target: [ x86_64-unknown-linux-gnu ]
    steps:
      - name: Install git-lfs
        run: |
          apt-get update
          apt-get install -y git-lfs
          git lfs install --skip-repo

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: true

      - name: Setup Rust Environment
        uses: ./.forgejo/actions/setup-rust
        with:
          system-deps: 'true'
          cache: false
          targets: ${{ matrix.target }}
          tools: 'just taplo-cli'

      - name: Build Binary
        run: bash misc/ci/build-binary.sh ${{ matrix.target }}

      - name: Upload Artifact
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: rdf-fusion-${{ matrix.target }}
          path: target/rdf-fusion-*.tar.gz

  build-wasm:
    name: Build Wasm Bindings
    needs: validate
    runs-on: tuw-runner
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Environment
        uses: ./.forgejo/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          components: ''
          tools: ''

      - name: Install wasm-pack
        uses: https://github.com/jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      - name: Build WebAssembly
        run: |
          mkdir -p target
          wasm-pack build --target web --release lib/wasm
          tar -czvf target/rdf-fusion-wasm.tar.gz -C lib/wasm pkg

      - name: Upload Artifact
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: rdf-fusion-wasm
          path: target/rdf-fusion-wasm.tar.gz

  create-release:
    name: Create Forgejo Release
    needs: [ build-binaries, build-wasm ]
    runs-on: tuw-runner
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Binaries
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          release-dir: artifacts
          title: RDF Fusion ${{ github.ref_name }}
          tag: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}