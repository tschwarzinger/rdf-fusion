name: Release

on:
  push:
    tags:
      - 'release/*'

jobs:
  validate:
    name: Validate Version
    runs-on: tuw-runner
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95
      - name: Rust Cache
        uses: https://github.com/Swatinem/rust-cache@v2
      - name: Check Version
        run: bash misc/ci/check-version.sh ${{ github.ref_name }}

  publish-crates:
    name: Publish to Crates.io
    needs: validate
    runs-on: tuw-runner
    steps:
      - name: Install System Dependencies
        run: |
          apt-get update
          apt-get install -y git-lfs build-essential cmake clang libclang-dev
          git lfs install

      - name: Setup Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95
          components: rustfmt, clippy

      - name: Rust Cache
        uses: https://github.com/Swatinem/rust-cache@v2

      - name: Install Cargo Dependencies
        run: |
          cargo install just
          cargo install taplo-cli

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: true

      - name: Run Tests
        run: just lint bench::prepare-benches-tests test test-examples rustdoc

      - name: Publish
        run: bash misc/ci/publish-crates.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build-binaries:
    name: Build Binaries
    needs: validate
    runs-on: tuw-runner
    strategy:
      matrix:
        target: [ x86_64-unknown-linux-gnu ]
    steps:
      - name: Install System Dependencies
        run: |
          apt-get update
          apt-get install -y git-lfs build-essential cmake clang libclang-dev
          git lfs install

      - name: Setup Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Cargo Dependencies
        run: |
          cargo install just
          cargo install taplo-cli

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: true

      - name: Build Binary
        run: bash misc/ci/build-binary.sh ${{ matrix.target }}

      - name: Upload Artifact
      - uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: rdf-fusion-${{ matrix.target }}
          path: target/rdf-fusion-*.tar.gz

  create-release:
    name: Create Forgejo Release
    needs: [ build-binaries, build-source ]
    runs-on: tuw-runner
    steps:
      - uses: actions/checkout@v4
      - name: Download Binaries
        uses: actions/download-artifact@v3
        with:
          path: artifacts
      - name: Create Release
        uses: https://github.com/softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}