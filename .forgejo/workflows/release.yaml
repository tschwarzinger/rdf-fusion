name: Release

on:
  push:
    tags:
      - 'release/*'

jobs:
  validate:
    name: Validate Version
    runs-on: tuw-runner
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97
      - name: Rust Cache
        uses: https://github.com/Swatinem/rust-cache@v2
      - name: Check Version
        run: bash misc/ci/check-version.sh ${{ github.ref_name }}

  publish-crates:
    name: Publish to Crates.io
    needs: validate
    runs-on: tuw-runner
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97
      - name: Rust Cache
        uses: https://github.com/Swatinem/rust-cache@v2
      - name: Install Just
        run: cargo install just
      - name: Run Tests
        run: just lint bench::prepare-benches-tests test test-examples rustdoc
      - name: Publish
        run: bash misc/ci/publish-crates.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build-binaries:
    name: Build Binaries
    needs: validate
    runs-on: tuw-runner
    strategy:
      matrix:
        target: [ x86_64-unknown-linux-gnu ]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97
          targets: ${{ matrix.target }}
      - name: Rust Cache
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build Binary
        run: bash misc/ci/build-binary.sh ${{ matrix.target }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: binary-${{ matrix.target }}
          path: target/rdf-fusion-*.tar.gz

  build-source:
    name: Build Source Tarball
    needs: validate
    runs-on: tuw-runner
    steps:
      - uses: actions/checkout@v4
      - name: Package Source
        run: bash misc/ci/package-source.sh
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: source-tarball
          path: target/rdf-fusion-source.tar.gz

  create-release:
    name: Create Forgejo Release
    needs: [ build-binaries, build-source ]
    runs-on: tuw-runner
    steps:
      - uses: actions/checkout@v4
      - name: Download Binaries
        uses: actions/download-artifact@v3
        with:
          path: artifacts
      - name: Download Source
        uses: actions/download-artifact@v3
        with:
          name: source-tarball
          path: artifacts
      - name: Create Release
        uses: https://github.com/softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}