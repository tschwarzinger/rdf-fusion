name: Rust

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: tuw-runner

    steps:
      - name: Install git-lfs
        run: |
          apt-get update
          apt-get install -y git-lfs
          git lfs install --skip-repo

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: true

      - name: Setup Rust Environment
        uses: ./.forgejo/actions/setup-rust
        with:
          system-deps: 'true'
          extra-system-packages: 'python3'
          tools: 'just taplo-cli'

      - name: Prepare Benches for Tests
        run: just bench prepare-benches-tests

      - name: Tests
        run: just test ci

      # `just test ci` already builds `target/ci/rdf-fusion` for the CLI tests, so this step does not
      # build anything.
      - name: Integration Tests
        run: python3 cli/tests/integration.py --bin target/ci/rdf-fusion

      - name: Test Examples
        run: just test-examples

  lint:
    runs-on: tuw-runner

    steps:
      - name: Install git-lfs
        run: |
          apt-get update
          apt-get install -y git-lfs
          git lfs install --skip-repo

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Rust Environment
        uses: ./.forgejo/actions/setup-rust
        with:
          system-deps: 'true'
          extra-system-packages: 'nodejs npm'
          tools: 'just taplo-cli'

      - name: Lints
        run: just lint ci

  docs:
    runs-on: tuw-runner

    steps:
      - name: Install git-lfs
        run: |
          apt-get update
          apt-get install -y git-lfs
          git lfs install --skip-repo

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Rust Environment
        uses: ./.forgejo/actions/setup-rust
        with:
          system-deps: 'true'
          extra-system-packages: 'nodejs npm'
          tools: 'just taplo-cli'

      - name: Docs
        run: just rustdoc