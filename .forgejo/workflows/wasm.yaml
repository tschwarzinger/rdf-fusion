name: Wasm

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, labeled, unlabeled ]

jobs:
  lint:
    name: Lint Wasm
    runs-on: tuw-runner
    if: contains(github.event.pull_request.labels.*.name, 'wasm')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Environment
        uses: ./.forgejo/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          tools: 'just'

      - name: Lint Wasm
        run: just lint-wasm

  # Heavy Playground webdriver E2E. Runs only when the PR carries the
  # `pages/playground` or `wasm` label (or via manual dispatch), so day-to-day
  # PRs aren't slowed down. Defaults to building the *current* Wasm build with
  # `wasm-pack build --target web --dev` and uploading it through the playground
  # UI as a custom version.
  webdriver:
    name: Playground Webdriver Tests
    runs-on: tuw-runner
    if: contains(github.event.pull_request.labels.*.name, 'wasm') ||
      contains(github.event.pull_request.labels.*.name, 'pages/playground')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Environment
        uses: ./.forgejo/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          components: ''
          tools: 'just'

      - name: Setup Node
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: misc/pages/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: misc/pages

      - name: Setup Hugo
        uses: https://github.com/peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.123.7'

      - name: Install wasm-pack
        uses: https://github.com/jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps firefox
        working-directory: misc/pages

      - name: Run Playground Webdriver Tests
        run: just test-web
        env:
          CI: 'true'

      - name: Upload Playwright Report
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            misc/pages/playwright-report/
            misc/pages/test-results/
