name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: tuw-runner
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: misc/pages/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: misc/pages

      - name: Build Svelte App
        run: npm run build
        working-directory: misc/pages

      - name: Setup Hugo
        uses: https://github.com/peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.123.7'

      - name: Build Hugo Site
        run: hugo --minify
        working-directory: misc/pages

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          ./aws/install

      # The website has its own storage zone (separate from `rdf-fusion-public`) because `--delete`
      # removes everything in the bucket that is not part of the freshly built site.
      - name: Upload to Bunny Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RDF_FUSION_WEB_S3_ACCESS_TOKEN }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RDF_FUSION_WEB_S3_SECRET_ACCESS_TOKEN }}
          AWS_DEFAULT_REGION: de
        run: |
          BUCKET_NAME="rdf-fusion-web"
          ENDPOINT_URL="https://de-s3.storage.bunnycdn.com"

          aws s3 sync misc/pages/public/ s3://$BUCKET_NAME/ --delete --endpoint-url $ENDPOINT_URL

      - name: Purge CDN Cache
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_PULL_ZONE_ID: ${{ secrets.BUNNY_WEB_PULL_ZONE_ID }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "AccessKey: $BUNNY_API_KEY" \
            "https://api.bunny.net/pullzone/$BUNNY_PULL_ZONE_ID/purgeCache"
