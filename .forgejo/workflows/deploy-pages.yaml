name: Deploy to Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: tuw-runner
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: misc/pages/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: misc/pages

      - name: Build Svelte App
        run: npm run build
        working-directory: misc/pages

      - name: Setup Hugo
        uses: https://github.com/peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.123.7'

      - name: Build Hugo Site
        run: hugo --minify
        working-directory: misc/pages

      - name: Deploy to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://tschwarzinger.codeberg.page/rdf-fusion/
          token: ${{ forge.token }}
          source: misc/pages/public/
